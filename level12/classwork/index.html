<body>


    <!-- 0) ახსენით რას შვება Radio Checkbox და Color

<!-- checkbox aris asarchevi quizistvis da radioc egeti ogond mrgvali asarchevia da checkboxsi otxkutxedi da colori aris ubralod rom feri airchios adamianma -->
<h1>Registration form</h1>
    <form>
        <label for="firstname">FirstName :</label>
        <input type="text"  placeholder="Enter First Name" id="firstname">
        <br>
        <label for="lastname" >LastName :</label>
        <input type="text" placeholder="Enter Last Name" id="lastname">
        <br>
         <label for="email" >email :</label>
        <input type="email" placeholder="Enter email" id="email">
        <br>
        <label for="password" >password :</label>
        <input type="password" placeholder="Enter password" id="password">
        <h4>gender :</h4>
        <input type="radio" id="male" name="genders">
        <label for="male">Male</label>
        <br>
        <input type="radio" id="famale" name="genders">
        <label for="famale">Famale</label><br>
        <input type="radio" id="other" name="genders">
        <label for="other">Other</label><br>
        <label for="age">Age</label>
        <input type="number" id="age" name="age">
        <br>
        <label for="color">color</label>
        <input type="color" id="color">
        <br>
        <label for="submit"></label>
        <input type="submit" id="submit">
    </form>
</body>
