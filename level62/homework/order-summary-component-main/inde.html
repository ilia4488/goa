<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="st.css">
</head>
<body>
    <div class="main-container">
        <div class="card">
            
            <div class="card-hero">
                <img src="/homework/order-summary-component-main/images/illustration-hero.svg" alt="Person listening to music" class="hero-img">
            </div>
            
            <div class="card-content">
                <h1 class="title">Order Summary</h1>
                <p class="description">
                    You can now listen to millions of songs, audiobooks, and podcasts on any device anywhere you like!
                </p>
                
                <div class="plan-box">
                    <div class="plan-details">
                        <div class="icon-container">
                            <img src="/homework/order-summary-component-main/images/icon-music.svg" alt="Music icon">
                        </div>
                        <div class="plan-text">
                            <div class="plan-name">Annual Plan</div>
                            <div class="plan-price">$59.99/year</div>
                        </div>
                    </div>
                    <div class="change-link">Change</div>
                </div>
                
                <div class="btn-primary">Proceed to Payment</div>
                <div class="btn-secondary">Cancel Order</div>
            </div>

        </div>
    </div>
</body>
</html>
