<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
<h2>Registration Form</h2>
    <form>
        <label>First Name:</label><br>
        <input type="text" placeholder="First Name"><br><br>

        <label>Last Name:</label><br>
        <input type="text" placeholder="Last Name"><br><br>

        <label>Email:</label><br>
        <input type="email" placeholder="Email"><br><br>

        <label>Password:</label><br>
        <input type="password" placeholder="Password"><br><br>

        <label>Re-type Password:</label><br>
        <input type="password" placeholder="Re-type Password"><br><br>

        <label>Contact:</label><br>
        <input type="text" placeholder="Contact Number"><br><br>
    </form>

    <hr>

    <h1>HTML Form</h1>
    <form>
        <label>First Name :</label>
        <input type="text" placeholder="Enter First Name"><br><br>

        <label>Last Name :</label>
        <input type="text" placeholder="Enter Last Name"><br><br>

        <label>Date of Birth :</label>
        <input type="date"><br><br>

        <label>Email id :</label>
        <input type="email" placeholder="Enter Email"><br><br>

        <label>Mobile Number :</label>
        <input type="number" placeholder="Enter Mobile Number"><br><br>

        <input type="submit" value="Submit">
    </form>
</body>
</html>
