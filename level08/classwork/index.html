<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>


<!-- 0) input types -->
<!-- text - text input -->
<!-- password - hidden text input -->
<!-- email - email format input -->
<!-- number - numbers only -->
<!-- checkbox - true/false -->
<!-- radio - one choice -->
<!-- submit - send form -->


<!-- 1) user form (name, email, password) -->
<form>
    <input type="text" placeholder="name" required><br><br>
    <input type="email" placeholder="email" required><br><br>
    <input type="password" placeholder="password" required><br><br>
    <button type="submit">submit</button>
</form>


<!-- 2) required -->
<!-- required means field must be filled -->
<!-- if empty, form will not submit -->


<br><br>


<!-- 3) design form -->

<form>
    <label>Username</label>
    <input type="text" placeholder="Enter Username" required><br><br>

    <label>Age</label>
    <input type="number" placeholder="Enter Age" required><br><br>

    <label>City</label>
    <input type="text" placeholder="Enter City" required><br><br>

    <label>Comment</label>
    <input type="text" placeholder="Enter Comment" required><br><br>

    <button type="submit">submit</button>
</form>

</body>
</html>
